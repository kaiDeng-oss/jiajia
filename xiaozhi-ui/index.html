<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>嘉嘉 💕 你的贴心小女友</title>
    <link rel="stylesheet" href="css/index.css?v=0222">
</head>

<body>
    <!-- 背景容器 -->
    <div class="background-container" id="backgroundContainer">
        <div class="background-overlay"></div>
        <div class="floating-hearts">
            <span>💗</span><span>💕</span><span>💖</span><span>💗</span><span>💕</span>
        </div>
    </div>

    <!-- 主容器 -->
    <div class="container">
        <!-- 顶部：嘉嘉信息栏 -->
        <div class="header-bar">
            <div class="jijia-avatar">
                <div class="avatar-circle">嘉</div>
            </div>
            <div class="header-info">
                <div class="jijia-name">嘉嘉 <span class="name-heart">💗</span></div>
                <div class="jijia-tagline">你的贴心小女友 · 随时都在</div>
            </div>
            <div class="connection-status-top">
                <div class="status-indicator">
                    <span class="status-dot status-disconnected"></span>
                    <span id="connectionStatus">离线</span>
                </div>
            </div>
        </div>

        <!-- 主体：钢铁侠虚拟体 + 聊天 -->
        <div class="main-area">
            <!-- 嘉嘉形象面板 -->
            <div class="jiajia-panel">
                <h3>💗 嘉嘉 <small>移动鼠标 · 温柔看着你</small></h3>
                <div class="jiajia-photo-frame" id="jiajiaPhotoFrame">
                    <!-- 内容由 media-carousel.js 动态填充（轮播 D:\Project\data 里的图/视频） -->
                    <div id="jiajiaMediaStage"></div>
                </div>
                <div class="jiajia-status">状态 <span class="core-state" id="jiajiaState">待机</span></div>
            </div>

            <!-- 聊天消息流 -->
            <div class="chat-container">
                <div class="chat-stream" id="chatStream">
                    <!-- 聊天消息将动态插入这里 -->
                </div>

                <!-- 音频可视化 -->
                <div class="visualizer-wrap">
                    <canvas id="audioVisualizer"></canvas>
                </div>

                <!-- 文字输入 -->
                <div class="chat-ipt" id="chatIpt">
                    <input type="text" id="messageInput" autocomplete="off" placeholder="想跟嘉嘉说点什么？按 Enter 发送~">
                </div>
            </div>
        </div>

        <!-- 底部控制栏 -->
        <div class="control-bar">
            <button class="control-btn control-btn-soft" id="settingsBtn" title="设置">
                <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor">
                    <path
                        d="M12 15.5A3.5 3.5 0 0 1 8.5 12A3.5 3.5 0 0 1 12 8.5A3.5 3.5 0 0 1 15.5 12A3.5 3.5 0 0 1 12 15.5M19.43 12.97C19.47 12.65 19.5 12.33 19.5 12C19.5 11.67 19.47 11.34 19.43 11L21.54 9.37C21.73 9.22 21.78 8.95 21.66 8.73L19.66 5.27C19.54 5.05 19.27 4.96 19.05 5.05L16.56 6.05C16.04 5.66 15.5 5.32 14.87 5.07L14.5 2.42C14.46 2.18 14.25 2 14 2H10C9.75 2 9.54 2.18 9.5 2.42L9.13 5.07C8.5 5.32 7.96 5.66 7.44 6.05L4.95 5.05C4.73 4.96 4.46 5.05 4.34 5.27L2.34 8.73C2.22 8.95 2.27 9.22 2.46 9.37L4.57 11C4.53 11.34 4.5 11.67 4.5 12C4.5 12.33 4.53 12.65 4.57 12.97L2.46 14.63C2.27 14.78 2.22 15.05 2.34 15.27L4.34 18.73C4.46 18.95 4.73 19.03 4.95 18.95L7.44 17.94C7.96 18.34 8.5 18.68 9.13 18.93L9.5 21.58C9.54 21.82 9.75 22 10 22H14C14.25 22 14.46 21.82 14.5 21.58L14.87 18.93C15.5 18.68 16.04 18.34 16.56 17.94L19.05 18.95C19.27 19.03 19.54 18.95 19.66 18.73L21.66 15.27C21.78 15.05 21.73 14.78 21.54 14.63L19.43 12.97Z" />
                </svg>
                <span class="btn-text">设置</span>
            </button>

            <button class="control-btn dial-btn" id="dialBtn" title="连接嘉嘉">
                <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor">
                    <path
                        d="M6.62,10.79C8.06,13.62 10.38,15.94 13.21,17.38L15.41,15.18C15.69,14.9 16.08,14.82 16.43,14.93C17.55,15.3 18.75,15.5 20,15.5A1,1 0 0,1 21,16.5V20A1,1 0 0,1 20,21A17,17 0 0,1 3,4A1,1 0 0,1 4,3H7.5A1,1 0 0,1 8.5,4C8.5,5.25 8.7,6.45 9.07,7.57C9.18,7.92 9.1,8.31 8.82,8.59L6.62,10.79Z" />
                </svg>
                <span class="btn-text">呼叫嘉嘉</span>
            </button>

            <button class="control-btn record-btn" id="recordBtn" title="开始录音" disabled>
                <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor">
                    <path
                        d="M12,2A3,3 0 0,1 15,5V11A3,3 0 0,1 12,14A3,3 0 0,1 9,11V5A3,3 0 0,1 12,2M19,11C19,14.53 16.39,17.44 13,17.93V21H11V17.93C7.61,17.44 5,14.53 5,11H7A5,5 0 0,0 12,16A5,5 0 0,0 17,11H19Z" />
                </svg>
                <span class="btn-text">录音</span>
            </button>

            <button class="control-btn camera-btn" id="cameraBtn" title="打开摄像头">
                <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor">
                    <path
                        d="M17 10.5V7a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-3.5l4 4v-11l-4 4Z" />
                </svg>
                <span class="btn-text">摄像头</span>
            </button>
        </div>
    </div>

    <!-- 设置弹窗 -->
    <div class="modal" id="settingsModal">
        <div class="modal-content settings-modal">
            <div class="modal-header">
                <h2>设置 <span class="name-heart">💗</span></h2>
                <button class="close-btn" id="closeSettingsBtn">&times;</button>
            </div>
            <div class="modal-body">
                <div class="settings-tabs">
                    <button class="tab-btn active" data-tab="device">设备配置</button>
                    <button class="tab-btn" data-tab="wakeword">唤醒词</button>
                    <button class="tab-btn" data-tab="other">其他</button>
                </div>

                <div class="tab-content active" id="deviceTab">
                    <!-- 设备配置面板 -->
                    <div class="config-panel">
                        <div class="control-panel">
                            <div class="config-row">
                                <div class="config-item">
                                    <label for="deviceMac">设备MAC:</label>
                                    <input type="text" id="deviceMac" placeholder="device-id">
                                </div>
                            </div>
                            <div class="config-row">
                                <div class="config-item">
                                    <label for="clientId">客户端ID:</label>
                                    <input type="text" id="clientId" value="web_test_client" placeholder="client-id">
                                </div>
                                <div class="config-item">
                                    <label for="deviceName">设备名称:</label>
                                    <input type="text" id="deviceName" value="嘉嘉的设备" maxlength="50"
                                        placeholder="deviceName">
                                </div>
                            </div>
                            <div class="config-row">
                                <div class="config-item">
                                    <label for="emojiEnabled">情绪表情:</label>
                                    <select id="emojiEnabled" class="model-select">
                                        <option value="true">启用</option>
                                        <option value="false" selected>禁用</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 连接信息面板 -->
                    <div class="connection-controls">
                        <div class="input-group">
                            <label for="otaUrl">服务器地址:</label>
                            <input type="text" id="otaUrl" value="http://127.0.0.1:8003/xiaozhi/ota/"
                                placeholder="服务器地址，如：http://127.0.0.1:8003/xiaozhi/ota/" />
                        </div>
                        <div class="input-group">
                            <label for="serverUrl">WebSocket服务器地址:</label>
                            <input type="text" id="serverUrl" value="" readonly disabled
                                placeholder="填写服务器地址后，点击呼叫按钮自动连接" />
                        </div>
                        <div class="input-group">
                            <label for="visionUrl">视觉分析地址:</label>
                            <input type="text" id="visionUrl" value="" readonly disabled placeholder="成功建立ws连接后自动获取" />
                        </div>
                    </div>
                </div>

                <div class="tab-content" id="wakewordTab">
                    <div class="config-panel">
                        <div class="control-panel">
                            <div class="config-row">
                                <div class="config-item">
                                    <label for="wakewordEnabled">启用本地唤醒词:</label>
                                    <select id="wakewordEnabled" class="model-select">
                                        <option value="true">启用</option>
                                        <option value="false">禁用</option>
                                    </select>
                                </div>
                            </div>
                            <div class="config-row">
                                <div class="config-item">
                                    <label for="wakewordWsUrl">唤醒词服务地址:</label>
                                    <input type="text" id="wakewordWsUrl" placeholder="ws://127.0.0.1:8006/wakeword-ws">
                                </div>
                            </div>
                            <div class="config-row">
                                <div class="config-item">
                                    <label for="wakewordList">唤醒词配置 (一行一个):</label>
                                    <textarea id="wakewordList" placeholder="例如：&#10;嘉嘉&#10;亲爱的"></textarea>
                                </div>
                            </div>
                            <div class="modal-actions">
                                <button type="button" class="btn-primary" id="applyWakewordBtn">应用唤醒词</button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="tab-content" id="otherTab">
                    <div class="other-settings-panel">
                        <div class="control-panel">
                            <div class="config-row">
                                <div class="config-item">
                                    <label></label>
                                    <button class="background-btn" id="backgroundBtn" title="切换背景">
                                        <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor">
                                            <path
                                                d="M12,18A6,6 0 0,1 6,12C6,11 6.25,10.03 6.7,9.2L5.24,7.74C4.46,8.97 4,10.43 4,12A8,8 0 0,0 12,20V23L16,19L12,15V18M12,4V1L8,5L12,9V6A6,6 0 0,1 18,12C18,13 17.75,13.97 17.3,14.8L18.76,16.26C19.54,15.03 20,13.57 20,12A8,8 0 0,0 12,4Z" />
                                        </svg>
                                        <span class="btn-text">切换背景</span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 摄像头预览（浮层，可拖拽移动） -->
    <div class="camera-container" id="cameraContainer">
        <video id="cameraVideo" autoplay playsinline muted></video>
        <div class="camera-switch-mask" id="cameraSwitchMask">
            <div class="camera-switch-container">
                <div class="camera-switch" id="cameraSwitch" title="切换前后摄像头">
                    <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor">
                        <path
                            d="M20 5h-3.17L15 3H9L7.17 5H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2m-5 13a5 5 0 0 1-4.9-4H8.5l2.5-3 2.5 3h-1.6a3 3 0 0 0 5.6 1.2l1.5 1A5 5 0 0 1 15 18m3.5-7-2.5 3-2.5-3h1.6a3 3 0 0 0-5.6-1.2l-1.5-1A5 5 0 0 1 16 6a5 5 0 0 1 4.9 4h-2.4Z" />
                    </svg>
                </div>
            </div>
        </div>
    </div>

    <!-- 模型加载遮罩（默认隐藏，由 app.js setModelLoadingStatus 控制） -->
    <div class="model-loading" id="modelLoading" style="display: none;">
        <div class="loading-text">加载中 ✨</div>
    </div>

    <!-- Opus 音频库状态（加载成功后由 opus-codec.js 自动隐藏） -->
    <div class="script-status" id="scriptStatus">Opus 音频库加载中…</div>

    <!-- 音频编码与主应用 -->
    <script type="importmap">
        {
            "imports": {
                "three": "./js/three/three.module.js"
            }
        }
    </script>
    <script src="js/utils/libopus.js?v=0222"></script>
    <script type="module" src="js/core/jiajia-avatar.js?v=0222"></script>
    <script type="module" src="js/app.js?v=0222"></script>
    <script type="module" src="js/core/camera-glance.js?v=0222"></script>
    <script type="module" src="js/core/media-carousel.js?v=0222"></script>
</body>

</html>
